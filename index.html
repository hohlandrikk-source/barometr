<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Барометр рынка — активность конкурентов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--ac:#006DF0;--ac-d:#0052B4;--ink:#101828;--mu:#667085;--ln:#EAECF0;--bd:#D0D5DD;--bg:#F2F4F7;--red:#B42318}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
a{color:var(--ac)}a:hover{color:var(--ac-d)}
button{font:inherit;cursor:pointer}
.wrap{display:flex;flex-wrap:wrap;min-height:100vh;align-items:flex-start}
/* sidebar */
aside{flex:1 1 280px;max-width:320px;padding:24px 0 24px 24px;position:sticky;top:0;max-height:100vh;overflow:auto}
.sb{background:#fff;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:18px;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.brand{font-weight:800;font-size:20px;display:flex;flex-direction:column}
.brand small{font-weight:600;font-size:12px;color:var(--mu)}
.fl{display:flex;flex-direction:column;gap:8px}
.fl>span,.fl>label{font-size:12px;font-weight:600;color:var(--mu)}
select,input[type=search],input[type=date]{font:inherit;font-size:14px;padding:9px 10px;border-radius:10px;border:1px solid var(--bd);background:#fff;color:var(--ink);width:100%}
.dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}.dates input{min-width:0;padding:8px 6px;font-size:12px}
.weeks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.weeks button{font-size:12px;padding:7px 0;border-radius:8px;border:0;background:#F2F4F7;color:var(--ink);font-weight:600}
.weeks button.on{background:var(--ac);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--bd);background:#fff;color:var(--ink)}
.pill.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pill.zero{opacity:.45}
.pill .n{opacity:.7;margin-left:2px}
.more{font-size:12px;border:0;background:none;color:var(--ac);padding:0;align-self:flex-start;font-weight:600}
.btn-dark{font-size:14px;font-weight:600;padding:11px;border-radius:10px;border:0;background:var(--ink);color:#fff}
.btn-ghost{font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--bd);background:#fff;color:var(--ac);text-decoration:none;white-space:nowrap}
.reset{font-size:13px;border:0;background:none;color:var(--mu);padding:0;text-decoration:underline}
/* main */
main{flex:999 1 560px;min-width:0;padding:24px 28px 56px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.top .k{font-size:13px;color:var(--mu);font-weight:600}
.top h1{margin:0;font-size:30px;font-weight:800;line-height:1.15}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.issue{display:flex;flex-direction:column;gap:16px}
.issue+.issue{margin-top:22px;padding-top:22px;border-top:2px dashed var(--bd)}
.issue>h2{margin:0;font-size:20px;font-weight:800;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.issue>h2 span{font-size:13px;color:var(--mu);font-weight:600}
.sv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media(max-width:1100px){.sv{grid-template-columns:1fr}}
.card{background:#fff;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.chip{align-self:flex-start;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}
.c-fp{background:#E8F1FF;color:#0B4AA8}.c-in{background:#FFF1E5;color:#9A4A00}.c-ps{background:#E9F7EF;color:#1C6B3E}.c-km{background:#F4EBFF;color:#5B21B6}
.news{margin:0;font-size:14px;line-height:1.45;cursor:pointer;border-radius:8px;padding:2px 4px;margin:0 -4px}
.news:hover{background:#F9FAFB}
.news b{font-weight:600}
.news .d{color:var(--mu)}
.news .co{font-size:11px;font-weight:800;color:var(--ac);text-transform:uppercase;letter-spacing:.03em;margin-right:4px}
.gt{color:var(--ac);text-decoration:none;font-weight:800;white-space:nowrap}
.empty-b{color:var(--mu);font-size:13px}
.tw{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.tw .hd{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.tw .hd h3{margin:0;font-size:20px;font-weight:800}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:960px}
th{padding:10px 12px;text-align:left;font-size:12px;font-weight:600;color:var(--mu);background:#F9FAFB}
td{padding:12px;vertical-align:top;border-top:1px solid var(--ln);font-size:14px}
tr.row{cursor:pointer}
tr.row:hover td{background:#FCFCFD}
.vis{width:132px;height:92px;object-fit:cover;border-radius:10px;display:block;background:#F2F4F7}
.vis.none{display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:12px}
.adco{font-weight:800}
.admeta{color:var(--mu);font-size:13px}
.prod{font-weight:600}
.imp{background:#FFF8E6;color:#6B4E00;border-radius:10px;padding:8px 10px;font-size:13px}
.del{display:none;font-size:12px;border:1px solid var(--red);color:var(--red);background:#fff;border-radius:8px;padding:3px 8px;margin-top:6px}
body.admin .del{display:inline-block}
.nothing{background:#fff;border-radius:16px;padding:48px;text-align:center;color:var(--mu)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:16px;padding:24px;width:min(760px,100%);display:flex;flex-direction:column;gap:12px;position:relative}
.mbox h3{margin:0;font-size:20px;font-weight:800;padding-right:40px}
.mbox .x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:#fff;font-size:18px}
.mbox .body{white-space:pre-wrap;font-size:14px;color:#344054;max-height:50vh;overflow:auto;background:#F9FAFB;border-radius:10px;padding:12px}
.mbox .imgs{display:flex;gap:8px;flex-wrap:wrap}
.mbox .imgs img{max-height:220px;max-width:100%;border-radius:10px;border:1px solid var(--ln)}
.mbox .facts{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.mbox .facts dt{color:var(--mu);font-weight:600}.mbox .facts dd{margin:0}
.login input{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:80;max-width:90vw}
@media(max-width:860px){aside{position:static;max-height:none;max-width:none;padding:16px 16px 0}main{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<aside><div class="sb">
  <div class="brand">Барометр<small>Центр маркетинговых исследований</small></div>
  <div class="fl"><label for="fIssue">Выпуск</label><select id="fIssue"></select></div>
  <div class="fl"><span>Неделя</span><div class="weeks" id="weeks"></div></div>
  <div class="fl"><span>Период</span><div class="dates"><input type="date" id="fFrom" aria-label="Дата с"><input type="date" id="fTo" aria-label="Дата по"></div></div>
  <div class="fl"><span>Блок</span><div class="pills" id="pBlock"></div></div>
  <div class="fl"><span>Компания</span><div class="pills" id="pCompany"></div></div>
  <div class="fl"><span>Бренд</span><div class="pills" id="pBrand"></div></div>
  <div class="fl"><span>Продукт</span><div class="pills" id="pProduct"></div></div>
  <div class="fl"><span>Канал</span><div class="pills" id="pChannel"></div></div>
  <input type="search" id="fQ" placeholder="Поиск" aria-label="Поиск">
  <button class="btn-dark" id="expCsv">Выгрузить в Excel</button>
  <button class="reset" id="reset">Сбросить фильтры</button>
</div></aside>
<main>
  <div class="top">
    <div><div class="k" id="kicker"></div><h1 id="title">Барометр рынка</h1></div>
    <div class="acts"><a class="btn-ghost" id="toSelect" href="select.html" style="display:none">Отбор новостей</a><button class="btn-ghost" id="adminBtn">Вход для редактора</button></div>
  </div>
  <div id="list"></div>
</main>
</div>
<div class="modal" id="mItem" role="dialog" aria-modal="true"><div class="mbox" id="mItemBox"></div></div>
<div class="modal" id="mLogin" role="dialog" aria-modal="true"><div class="mbox login">
  <button class="x" id="lX" aria-label="Закрыть">×</button>
  <h3>Вход для редактора</h3>
  <div style="font-size:13px;color:#667085">Ключ доступа GitHub (fine-grained token с правом записи в репозитории дашборда). Хранится только в этом браузере.</div>
  <input type="password" id="tok" placeholder="github_pat_…" aria-label="Ключ доступа">
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn-ghost" id="lOut">Выйти</button><button class="btn-dark" id="lOk">Войти</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const CFG={owner:'andreykhokhlov1',pub:'barometr',priv:'barometr-admin',branch:'main'};
const BLOCKS=['Финансовое поведение','Инфраструктура','Продукты и сервисы','Коммуникация'];
const BCLS={'Финансовое поведение':'c-fp','Инфраструктура':'c-in','Продукты и сервисы':'c-ps','Коммуникация':'c-km'};
const PILL_LIMIT=10;
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const $=s=>document.querySelector(s);
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d?d.split('-').reverse().join('.'):'';
let DATA=[],META={};
const st={issue:null,from:'',to:'',q:'',block:new Set(),company:new Set(),brand:new Set(),product:new Set(),channel:new Set(),expand:{}};
const G={block:x=>[x.block],company:x=>x.companies||[],brand:x=>x.brands||[],product:x=>x.products||[],channel:x=>x.channels||[]};
const issues=()=>[...new Set(DATA.map(x=>x.issue))].sort().reverse();
async function load(){
  try{DATA=await (await fetch('data/registry.json?'+Date.now())).json()}catch(e){DATA=[]}
  try{META=await (await fetch('data/meta.json?'+Date.now())).json()}catch(e){}
  DATA=DATA.filter(x=>x.status!=='deleted');
  readHash(); if(st.issue===null) st.issue=issues()[0]||'';
  initStatic(); render();
}
function initStatic(){
  const s=$('#fIssue');s.innerHTML='<option value="">Все выпуски</option>'+issues().map(i=>`<option value="${i}">${fmt(i)} · ${esc(period(i))}</option>`).join('');
  s.onchange=()=>{st.issue=s.value;render()};
  $('#fFrom').onchange=e=>{st.from=e.target.value;render()};
  $('#fTo').onchange=e=>{st.to=e.target.value;render()};
  $('#fQ').oninput=e=>{st.q=e.target.value.toLowerCase();render()};
  $('#reset').onclick=()=>{Object.assign(st,{from:'',to:'',q:''});['block','company','brand','product','channel'].forEach(k=>st[k].clear());$('#fFrom').value='';$('#fTo').value='';$('#fQ').value='';render()};
}
function period(i){const x=DATA.find(r=>r.issue===i);return x&&x.period||''}
function pass(x,skip){
  if(skip!=='issue'&&st.issue&&x.issue!==st.issue)return false;
  const d=x.date||x.issue;if(st.from&&d<st.from)return false;if(st.to&&d>st.to)return false;
  for(const k of ['block','company','brand','product','channel'])if(skip!==k&&st[k].size&&!G[k](x).some(v=>st[k].has(v)))return false;
  if(st.q){const t=[x.headline,x.detail,x.body,x.offer,x.impact,x.advertiser,(x.brands||[]).join(' ')].join(' ').toLowerCase();if(!t.includes(st.q))return false}
  return true;
}
function pills(id,key){
  const base=DATA.filter(x=>pass(x,key)),cnt={};base.forEach(x=>G[key](x).forEach(v=>cnt[v]=(cnt[v]||0)+1));
  let all=key==='block'?BLOCKS:[...new Set(DATA.flatMap(G[key]))].sort((a,b)=>(cnt[b]||0)-(cnt[a]||0)||a.localeCompare(b,'ru'));
  const full=all.length;if(!st.expand[key]&&all.length>PILL_LIMIT){all=all.filter((v,i)=>i<PILL_LIMIT||st[key].has(v))}
  $('#'+id).innerHTML=all.map(v=>`<button class="pill ${st[key].has(v)?'on':''} ${cnt[v]?'':'zero'}" data-v="${esc(v)}" aria-pressed="${st[key].has(v)}">${esc(v)} <span class="n">· ${cnt[v]||0}</span></button>`).join('')+(full>PILL_LIMIT?`<button class="more" data-k="${key}">${st.expand[key]?'Свернуть':'Ещё '+(full-PILL_LIMIT)}</button>`:'');
  $('#'+id).querySelectorAll('.pill').forEach(b=>b.onclick=()=>{const v=b.dataset.v;st[key].has(v)?st[key].delete(v):st[key].add(v);render()});
  const m=$('#'+id).querySelector('.more');if(m)m.onclick=()=>{st.expand[key]=!st.expand[key];render()};
}
function weeks(){
  const iss=issues().slice(0,5).reverse();
  $('#weeks').innerHTML=iss.map(i=>`<button class="${st.issue===i?'on':''}" data-i="${i}" title="Выпуск ${fmt(i)}">${fmt(i).slice(0,5)}</button>`).join('');
  $('#weeks').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.issue=st.issue===b.dataset.i?'':b.dataset.i;render()});
}
function render(){
  $('#fIssue').value=st.issue||'';weeks();
  pills('pBlock','block');pills('pCompany','company');pills('pBrand','brand');pills('pProduct','product');pills('pChannel','channel');
  const rows=DATA.filter(x=>pass(x));
  $('#kicker').textContent=(st.issue?`Выпуск ${fmt(st.issue)}`:'Все выпуски')+` · найдено ${rows.length}`+(META.updated?` · обновлено ${META.updated}`:'');
  $('#title').textContent=st.issue?`Барометр рынка · ${period(st.issue)}`:'Барометр рынка · история';
  list(rows);writeHash();
}
const shortCo=x=>(x.brands&&x.brands.length?x.brands:x.companies||[]).slice(0,2).join(', ');
function newsLine(x){return `<p class="news" data-id="${x.id}"><span class="co">${esc(shortCo(x))}</span><b>${esc(x.headline)}</b>${x.detail?` <span class="d">(${esc(x.detail)})</span>`:''}${x.url?` <a class="gt" href="${esc(x.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Источник">&gt;&gt;&gt;</a>`:''}</p>`}
function adRow(x){
  const img=(x.images||[])[0];const ch=(x.channels||[]).join(', ');
  const start=x.start?`с ${fmt(x.start).slice(0,5)}`:'';
  return `<tr class="row" data-id="${x.id}"><td>${img?`<img class="vis" loading="lazy" src="${esc(img)}" alt="">`:'<div class="vis none">нет визуала</div>'}</td>
  <td><div class="adco">${esc(x.advertiser||shortCo(x))}</div><div class="admeta">${esc([ch,start,x.tg_channels_n?`каналов: ${x.tg_channels_n}`:''].filter(Boolean).join(' · '))}</div><button class="del" data-id="${x.id}">Удалить</button></td>
  <td><div class="prod">${esc(x.headline)}</div><div class="admeta">${esc((x.products||[]).join(', '))}</div></td>
  <td>${esc(x.offer||x.detail||'')}</td>
  <td>${x.impact?`<div class="imp">${esc(x.impact)}</div>`:'<span class="admeta">—</span>'}</td></tr>`;
}
function list(rows){
  if(!rows.length){$('#list').innerHTML='<div class="nothing">Ничего не найдено — попробуйте ослабить фильтры</div>';return}
  const by={};rows.forEach(x=>(by[x.issue]=by[x.issue]||[]).push(x));
  const keys=Object.keys(by).sort().reverse();
  $('#list').innerHTML=keys.map(i=>{
    const xs=by[i];const sv=BLOCKS.slice(0,3).filter(b=>!st.block.size||st.block.has(b));
    const km=xs.filter(x=>x.block==='Коммуникация');
    const filt=st.q||['company','brand','product','channel'].some(k=>st[k].size);
    const cards=sv.map(b=>{const its=xs.filter(x=>x.block===b);if(filt&&!its.length)return '';return `<section class="card"><span class="chip ${BCLS[b]}">${b} · ${its.length}</span>${its.length?its.map(newsLine).join(''):'<div class="empty-b">Нет новостей по фильтрам</div>'}</section>`}).join('');
    const showKm=(!st.block.size||st.block.has('Коммуникация'))&&!(filt&&!km.length);
    return `<section class="issue">${keys.length>1?`<h2>Выпуск ${fmt(i)} <span>${esc(xs[0].period||'')} · ${xs.length}</span></h2>`:''}
      ${cards.trim()?`<div class="sv">${cards}</div>`:''}
      ${showKm?`<section class="tw"><div class="hd"><span class="chip c-km">Коммуникация · ${km.length}</span><h3>${esc(adTitle(i,km))}</h3></div>
      ${km.length?`<div class="scroll"><table><thead><tr><th>Визуал</th><th>Компания · канал · старт</th><th>Продукт</th><th>Оффер / крючок</th><th>Влияние на рынок</th></tr></thead><tbody>${km.map(adRow).join('')}</tbody></table></div>`:'<div class="hd empty-b">Нет коммуникаций по фильтрам</div>'}</section>`:''}
    </section>`}).join('');
  document.querySelectorAll('[data-id].news,tr.row').forEach(e=>e.onclick=ev=>{if(ev.target.closest('a,button'))return;openItem(e.dataset.id)});
  document.querySelectorAll('.del').forEach(b=>b.onclick=ev=>{ev.stopPropagation();delItem(b.dataset.id)});
}
function adTitle(i,km){const m=(META.headlines||{})[i];if(m)return m;const n=new Set(km.map(x=>x.companies&&x.companies[0]));return km.length?`Реклама ${n.size} компаний: ${[...n].filter(Boolean).slice(0,5).join(', ')}`:'Коммуникация'}
function openItem(id){
  const x=DATA.find(r=>r.id===id);if(!x)return;
  const f=[['Выпуск',fmt(x.issue)],['Блок',x.block],['Дата',fmt(x.date)],['Старт',fmt(x.start)],['Компания',(x.companies||[]).join(', ')],['Бренд',(x.brands||[]).join(', ')],['Продукт',(x.products||[]).join(', ')],['Канал',(x.channels||[]).join(', ')],['ТГ-каналов',x.tg_channels_n],['Каналы',(x.tg_channels||[]).join(', ')],['Посыл',x.message],['Оффер',x.offer],['Влияние на рынок',x.impact]].filter(r=>r[1]);
  $('#mItemBox').innerHTML=`<button class="x" aria-label="Закрыть">×</button><span class="chip ${BCLS[x.block]}">${esc(x.block)}</span><h3>${esc(x.headline)}</h3>${x.detail?`<div style="color:#667085">${esc(x.detail)}</div>`:''}
   ${(x.images||[]).length?`<div class="imgs">${x.images.map(s=>`<img src="${esc(s)}" alt="">`).join('')}</div>`:''}
   <dl class="facts">${f.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>
   ${x.body?`<div class="body">${esc(x.body)}</div>`:''}
   <div style="display:flex;gap:10px;align-items:center">${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">Открыть источник ↗</a>`:''}<span style="flex:1"></span><button class="del" data-id="${x.id}">Удалить</button></div>`;
  $('#mItem').classList.add('open');$('#mItemBox .x').onclick=()=>$('#mItem').classList.remove('open');
  $('#mItemBox .del').onclick=()=>{$('#mItem').classList.remove('open');delItem(x.id)};
}
$('#mItem').onclick=e=>{if(e.target.id==='mItem')$('#mItem').classList.remove('open')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'))});
function writeHash(){const p=new URLSearchParams();p.set('issue',st.issue||'all');for(const k of ['from','to'])if(st[k])p.set(k,st[k]);for(const k of ['block','company','brand','product','channel'])if(st[k].size)p.set(k,[...st[k]].join('|'));history.replaceState(null,'','#'+p.toString())}
function readHash(){const p=new URLSearchParams(location.hash.slice(1));if(p.get('issue'))st.issue=p.get('issue')==='all'?'':p.get('issue');for(const k of ['from','to'])if(p.get(k)){st[k]=p.get(k);$('#f'+(k==='from'?'From':'To')).value=st[k]}for(const k of ['block','company','brand','product','channel'])if(p.get(k))p.get(k).split('|').forEach(v=>st[k].add(v))}
$('#expCsv').onclick=()=>{
  const rows=DATA.filter(x=>pass(x));const cols=[['Выпуск','issue'],['Блок','block'],['Дата','date'],['Компании',x=>(x.companies||[]).join('; ')],['Бренды',x=>(x.brands||[]).join('; ')],['Продукты',x=>(x.products||[]).join('; ')],['Канал',x=>(x.channels||[]).join('; ')],['Заголовок','headline'],['Подробности','detail'],['Оффер','offer'],['Старт','start'],['ТГ-каналов','tg_channels_n'],['Влияние на рынок','impact'],['Ссылка','url']];
  const v=(x,c)=>{const r=typeof c[1]==='function'?c[1](x):x[c[1]];return '"'+(r??'').toString().replace(/"/g,'""')+'"'};
  const csv='﻿'+cols.map(c=>c[0]).join(';')+'\n'+rows.map(x=>cols.map(c=>v(x,c)).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='barometr_'+(st.issue||'all')+'.csv';a.click();
};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',4000)}
// ---- редактор ----
const GH={tok:()=>ls.get('gh_token'),
  async get(repo,path){const r=await fetch(`https://api.github.com/repos/${CFG.owner}/${repo}/contents/${path}?ref=${CFG.branch}`,{headers:{Authorization:'Bearer '+GH.tok(),Accept:'application/vnd.github+json'}});
    if(r.status===404)return {sha:null,json:null};if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();
    return {sha:j.sha,json:JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0))))}},
  async put(repo,path,obj,sha,msg){const b=new TextEncoder().encode(JSON.stringify(obj,null,1));let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode(...b.subarray(i,i+8192));
    const r=await fetch(`https://api.github.com/repos/${CFG.owner}/${repo}/contents/${path}`,{method:'PUT',headers:{Authorization:'Bearer '+GH.tok(),Accept:'application/vnd.github+json'},body:JSON.stringify({message:msg,content:btoa(s),sha:sha||undefined,branch:CFG.branch})});
    if(!r.ok)throw new Error('GitHub '+r.status);return r.json()}};
function setAdmin(){const on=!!GH.tok();document.body.classList.toggle('admin',on);$('#toSelect').style.display=on?'':'none';$('#adminBtn').textContent=on?'Режим редактора ✓':'Вход для редактора'}
$('#adminBtn').onclick=()=>{$('#tok').value='';$('#mLogin').classList.add('open');$('#tok').focus()};
$('#lX').onclick=()=>$('#mLogin').classList.remove('open');
$('#lOut').onclick=()=>{ls.del('gh_token');setAdmin();$('#mLogin').classList.remove('open')};
$('#lOk').onclick=()=>{const t=$('#tok').value.trim();if(t)ls.set('gh_token',t);$('#mLogin').classList.remove('open');setAdmin()};
async function delItem(id){
  const x=DATA.find(r=>r.id===id);if(!x||!confirm('Удалить новость из дашборда?\n«'+x.headline+'»\n\nОна попадёт в раздел «Удалённые» на странице отбора, откуда её можно вернуть.'))return;
  try{const pub=await GH.get(CFG.pub,'data/registry.json');const pr=await GH.get(CFG.priv,'deleted.json');
    const del=pr.json||[];del.push({...pub.json.find(r=>r.id===id),deleted_at:new Date().toISOString()});
    await GH.put(CFG.priv,'deleted.json',del,pr.sha,'Удалена новость '+id);
    await GH.put(CFG.pub,'data/registry.json',pub.json.filter(r=>r.id!==id),pub.sha,'Удалена новость '+id);
    DATA=DATA.filter(r=>r.id!==id);render();toast('Удалено. У остальных страница обновится через 1–2 минуты.');
  }catch(e){toast('Не удалось удалить: '+e.message+'. Проверьте ключ доступа.')}
}
setAdmin();load();
